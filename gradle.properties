# Project-wide Gradle settings.

# AndroidX package structure — required because this project's dependencies
# (androidx.core, androidx.appcompat, com.google.android.material, etc.)
# are AndroidX artifacts. Without this, AGP assumes the legacy Support
# Library and fails dependency resolution.
android.useAndroidX=true

# Kotlin code style for this project
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself, avoiding unnecessary
# rebuilds and improving build performance for larger projects.
android.nonTransitiveRClass=true
